version: 2

updates:
  - package-ecosystem: composer
    directory: /apps/server
    # One grouped pull request a month for version updates. Security updates are not on this schedule and
    # arrive the day they are published, one pull request each, because a known vulnerability does not wait
    # for a milestone. Version updates do: the lock file moves with the milestone commit, and a grouped
    # request is a reminder rather than a stream of small commits on the default branch.
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The framework is pinned to an exact commit on purpose, and moving it is a deliberate decision rather
      # than an automated bump. A nightly pipeline reports divergence without opening a pull request.
      - dependency-name: pulsar/framework

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

# The gradle and swift ecosystems are added in M6, with the manifests they read. Declaring an ecosystem whose
# manifest does not exist makes Dependabot log an error on every run, which trains everyone to ignore its
# reports.
