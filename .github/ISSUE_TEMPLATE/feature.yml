name: Feature
description: A capability the product should have.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe what a person cannot do today, not the solution you have in mind.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who this is for
      options:
        - Job seeker
        - Recruiter
        - Both
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How we would know it works
      description: The observable outcome. A feature with no measurable outcome cannot be finished.
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this must respect
      options:
        - label: Does not display a rejection to a candidate
        - label: Does not reveal contact details before a match
        - label: Does not introduce an automatic rejection
        - label: Adds no user-visible string outside a translation catalogue
        - label: Has a keyboard and screen-reader path if it involves a gesture
