name: Server

# The path filter applies to pushes only. On a pull request this workflow always runs, because it provides a
# required status check: a filtered check that never fires is not "skipped", it is permanently pending, and the
# pull request can never merge. The gates take a few minutes today. When a run becomes expensive (the iOS
# pipeline in M6), the filter comes back together with a companion job that reports the same context when
# nothing relevant changed.
on:
  push:
    # `staging` is the branch the host deploys from, so it is measured as well: a branch that reaches a real
    # server without passing the gates is a server running code nobody checked.
    branches: [main, staging]
    paths:
      - 'apps/server/**'
      - 'contract/**'
      - 'design/**'
      - '.github/workflows/server.yml'
      - '.github/actions/**'
  pull_request:
  schedule:
    # Mutation testing, weekly, so a suite that decays between pushes is noticed within the week.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  # Never cancel a run on the default branch: a merged commit that never finished its checks leaves the
  # branch in a state nobody measured.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: apps/server

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration suite talks to a real PostgreSQL on the runner. The suite fixes the database name itself
    # (phpunit.xml); the rest of the connection is read from the process, exactly as on a workstation. The
    # password is that of a role created a few steps below on a server that lives as long as this job.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: bothdecks
      DB_PASSWORD: bothdecks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, libxml, mbstring, openssl, pdo, pdo_pgsql, simplexml, sodium, zip, zlib
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The schema depends on two server extensions, `vector` for retrieval and `postgis` for commute
      # geometry. The action starts the runner's own server with both and prints the versions it measured.
      - name: Start PostgreSQL with pgvector and PostGIS
        uses: ./.github/actions/postgresql
        with:
          username: ${{ env.DB_USERNAME }}
          password: ${{ env.DB_PASSWORD }}

      # The gate sequence from docs/testing.md. Each step writes its own output; none is piped, so no step
      # reports another command's exit status.
      - name: Manifest and lock file
        run: composer run validate:manifest

      - name: Formatting
        run: composer run cs:check

      - name: Static analysis
        run: composer run phpstan

      # No module reaches another module's internals, and every dependency a module has is one the fence
      # declares. The rules live in deptrac.yaml; a guarantee test keeps them in step with the modules on disk.
      - name: Module boundaries
        run: composer run boundary:check

      # The design source is held to twelve checks: every colour renders its declared components, every
      # composed pair clears its contrast threshold, the generated themes and the design-file contract match
      # the source byte for byte. A theme that drifted from its source would ship three platforms that
      # disagree with each other and with the design file.
      - name: Design tokens
        run: composer run design:check

      - name: Unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite unit

      # Constructor injection resolves at dispatch time, not at compile time. A unit suite can be entirely
      # green while the application cannot serve a single request, so every route is exercised here.
      - name: Integration tests
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite integration

      # The guarantee suite is not run here. It scans the whole repository, so it belongs to the workflow that
      # carries no path filter; see the `guarantees` job in repository.yml. Running it behind this workflow's
      # filter would mean a change under `docs/` or `.github/` could break a guarantee without any pipeline
      # noticing.

      - name: Dependency audit
        run: composer run audit:deps

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: gates
    # Every mutant re-runs the tests that cover it, against a real database, which takes hours rather than
    # minutes. It is measured on what lands on a branch the host deploys from, and weekly, rather than on
    # every pull request; before a milestone is declared done it is run locally, as docs/testing.md asks.
    if: github.event_name != 'pull_request'
    timeout-minutes: 240

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: bothdecks
      DB_PASSWORD: bothdecks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, libxml, mbstring, openssl, pdo, pdo_pgsql, simplexml, sodium, zip, zlib
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start PostgreSQL with pgvector and PostGIS
        uses: ./.github/actions/postgresql
        with:
          username: ${{ env.DB_USERNAME }}
          password: ${{ env.DB_PASSWORD }}

      # Line coverage says which lines ran; this says which are actually checked. Without it the threshold in
      # infection.json5 is a number nobody enforces, and test quality can decay silently.
      - name: Mutation testing
        run: composer run mutation
